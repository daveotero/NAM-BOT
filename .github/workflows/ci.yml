name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    name: Typecheck and Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck application and tests
        run: npm run typecheck

      - name: Run tests
        run: npm test

  build-windows:
    name: Build Windows App
    runs-on: windows-2022
    needs: quality

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production app
        run: npm run build

      - name: Launch Windows desktop shell
        run: npm run test:desktop-shell

      - name: Upload desktop shell evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-shell-windows
          path: |
            test-results/
            playwright-report/

  build-macos:
    name: Build macOS App
    runs-on: macos-14
    needs: quality

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production app
        run: npm run build

      - name: Launch macOS desktop shell
        run: npm run test:desktop-shell

      - name: Upload desktop shell evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-shell-macos
          path: |
            test-results/
            playwright-report/
